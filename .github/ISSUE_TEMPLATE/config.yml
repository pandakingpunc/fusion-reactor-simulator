# Issue chooser: blank issues are off so that a report always carries the facts we need;
# security problems go to the private advisory form, not the public tracker.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/pandakingpunc/fusion-reactor-simulator/security/advisories/new
    about: Please do not open a public issue for a vulnerability. See SECURITY.md.
  - name: Contributing guide
    url: https://github.com/pandakingpunc/fusion-reactor-simulator/blob/main/CONTRIBUTING.md
    about: How to set up, run the checks and send a pull request.
