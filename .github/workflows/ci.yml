# Continuous integration: type check, unit tests, literature validation, golden regression, figure reproducibility and build
# on Linux and Windows for every supported Node.js major (package.json engines.node).
# Actions are pinned by full commit SHA (the tag is in the comment); Dependabot keeps them current.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      # Generated files must match their sources (the same three steps, in the same order, as scripts/ci-local.mjs).
      - name: Config schema up to date
        run: npm run schema:check

      - name: Scenario schema up to date
        run: npm run schema:scenario:check

      - name: Config reference up to date
        run: npm run docs:config:check

      - name: Unit tests
        run: npx vitest run

      - name: Literature validation
        run: npm run validate -- --threads 2

      # The golden snapshots (test/golden/*.json) are recorded on Windows Node 24 and compared at a
      # relative tolerance of 1e-9. V8's Math.* last bits change between releases, and a 1.5D case on
      # Ubuntu does not stay inside 1e-6 (SPARC15-short edge profiles 0.1–0.3 %, dWdt.min 3.8 %).
      # Widening the tolerance enough to pass that would hide a 1e-7 change. Other jobs still run the
      # unit tests, validation and build.
      - name: Golden regression (Windows Node 24 only)
        if: matrix.os == 'windows-latest' && matrix.node == 24
        run: npm run golden -- --threads 2

      # The paper figures in docs/figures are the ones recorded in docs/figures/figures.manifest.json and the code reproduces them
      # (npm run figures:check regenerates all nine and compares SHA-256 hashes; several minutes). The manifest is made on Windows Node 24
      # and the figures depend on its Math.* results (and the compressed PDF streams may on its zlib), so, like the goldens, this runs there only.
      - name: Figures reproducible (Windows Node 24 only)
        if: matrix.os == 'windows-latest' && matrix.node == 24
        run: npm run figures:check -- --threads 2

      - name: Build
        run: npm run build

      # The main chunk is what a first visit waits for (budget 250 kB, 85 kB gzip; scripts/check-bundle.mjs).
      - name: Main chunk within budget
        run: npm run check:bundle
